services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: fdp-engine-kafka

    ports:
      - "19092:19092"
      - "39092:39092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:39092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:39092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: A1B2C3D4E5F6G7H8I9J0K1

    volumes:
      - fdp_engine_kafka_data:/var/lib/kafka/data


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: fdp-engine-kafka-init
    depends_on:
      - kafka
    volumes:
      - ./kafka/topics.txt:/topics.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list > /dev/null 2>&1; do sleep 2; done
        for topic in $$(grep -v '^[[:space:]]*$$' /topics.txt | grep -v '^[[:space:]]*#'); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done


  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: fdp-engine-kafka-ui

    ports:
      - "8181:8080"

    depends_on:
      - kafka

    environment:
      KAFKA_CLUSTERS_0_NAME: fdp-engine
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092


  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: fdp-engine-clickhouse

    ports:
      - "8124:8123"
      - "9001:9000"

    environment:
      CLICKHOUSE_DB: fdp
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123

    volumes:
      - fdp_engine_clickhouse_data:/var/lib/clickhouse
      - fdp_engine_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d

  flink-jobmanager:
    build: ./flink
    container_name: fdp-engine-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./flink/sql:/opt/flink/usrlib/sql:ro
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    depends_on:
      - kafka
      - clickhouse

  flink-taskmanager:
    build: ./flink
    container_name: fdp-engine-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4


volumes:

  fdp_engine_kafka_data:

  fdp_engine_clickhouse_data:

  fdp_engine_clickhouse_logs:
